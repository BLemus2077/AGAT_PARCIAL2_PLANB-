<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Reporte de Asistencias</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.2/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/styles.css}">
    <script src="/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div th:replace="~{fragments/menu-lateral :: sidebar}"></div>
<div style="margin-left: 250px; padding: 20px;">
    <div class="container mt-5">
        <h2 class="mb-4 fw-bold titulo-principal text-center">📊 Reporte de Asistencias por Grupo</h2>

        <div class="card shadow-sm rounded p-4 bg-white">
            <canvas id="reporteChart" height="120"></canvas>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const data = /*[[${reporte}]]*/ [];

    const labels = data.map(item => item.grupo);
    const sinObs = data.map(item => item.sinObservaciones);
    const conObs = data.map(item => item.conObservaciones);

    const ctx = document.getElementById('reporteChart').getContext('2d');
    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [
                {
                    label: 'Asistieron sin observaciones',
                    data: sinObs,
                    backgroundColor: 'rgba(40, 167, 69, 0.7)'
                },
                {
                    label: 'Asistieron con observaciones',
                    data: conObs,
                    backgroundColor: 'rgba(220, 53, 69, 0.7)'
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: {
                    beginAtZero: true,
                    precision: 0,
                    ticks: {
                        stepSize: 1
                    }
                }
            },
            plugins: {
                legend: {
                    labels: {
                        font: {
                            size: 14
                        }
                    }
                }
            }
        }
    });
</script>
</body>
</html>
