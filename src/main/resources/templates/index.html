<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AGAT - Inicio</title>
    <link th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>
    <div class="container text-center">
        <!-- Logo central con tamaño ajustado -->
        <img th:src="@{/img/AGAT_LOGO.png}" alt="Logo AGAT" style="width: 400px;" class="img-fluid mb-4">

        <h1>App de Gestión de Asistencia para Tutores</h1>

        <div sec:authorize="!isAuthenticated()" class="mt-4">
            <a href="/oauth2/authorization/auth0" class="btn btn-primary">Iniciar Sesión</a>
        </div>

        <div sec:authorize="isAuthenticated()" class="mt-4">
            <a th:href="@{/estudiantes}" class="btn btn-success">Ir a Estudiantes</a>
        </div>
    </div>

    <!-- Scripts -->
    <script th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
