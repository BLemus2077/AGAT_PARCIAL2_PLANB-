<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGAT - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/styles.css}" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow">
                    <div class="card-body text-center">
                        <img th:src="@{/img/AGAT_LOGO.png}" alt="Logo AGAT" class="mb-4" style="max-width: 150px;">
                        <h2 class="mb-4">Iniciar Sesión</h2>

                        <!-- Botón de inicio de sesión con Auth0 -->
                        <a th:href="@{/oauth2/authorization/auth0}" class="btn btn-primary btn-lg w-100 mb-3">
                            Iniciar sesión con Auth0
                        </a>

                        <!-- Mensaje de error -->
                        <div th:if="${param.error}" class="alert alert-danger mt-3">
                            Error al iniciar sesión. Por favor, inténtalo de nuevo.
                        </div>

                        <div class="mt-3">
                            <small class="text-muted">Sistema de Gestión de Asistencia para Tutores</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
