version: "3.9"

services:
  app:
    image: openjdk:17-jdk-slim
    container_name: agat_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    volumes:
      - ./target:/app
    working_dir: /app
    command: java -jar PARCIAL_1_DAN-1.0.0-SNAPSHOT.jar